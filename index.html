<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aria Mirror AI Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/tokyo-night-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        geminiBg: '#131314',
                        geminiSidebar: '#1e1f20',
                        geminiHover: '#282a2c',
                        geminiInput: '#1e1f20',
                        geminiUserBubble: '#282a2c',
                        geminiText: '#e3e2e6',
                        geminiMuted: '#c4c6d0'
                    }
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: #131314; }
        ::-webkit-scrollbar-thumb { background: #282a2c; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #374151; }
        .markdown-body pre { background-color: #1e1f20 !important; border: 1px solid #282a2c; border-radius: 0.5rem; padding: 0.75rem; margin-top: 0.5rem; margin-bottom: 0.5rem; overflow-x: auto; }
        .markdown-body ul { list-style-type: disc; padding-left: 1.25rem; margin-top: 0.5rem; margin-bottom: 0.5rem; }
        .markdown-body ol { list-style-type: decimal; padding-left: 1.25rem; margin-top: 0.5rem; margin-bottom: 0.5rem; }
        .markdown-body p { margin-bottom: 0.75rem; line-height: 1.6; }
    </style>
</head>
<body class="bg-geminiBg text-geminiText min-h-screen flex font-sans antialiased overflow-hidden relative">

    <!-- OVERLAY PARA MÓVIL AL ABRIR SIDEBAR -->
    <div id="sidebar-overlay" onclick="toggleSidebar()" class="fixed inset-0 bg-black/60 z-30 hidden md:hidden transition-opacity"></div>

    <!-- SIDEBAR RESPONSIVO -->
    <aside id="sidebar" class="fixed md:static inset-y-0 left-0 z-40 w-72 md:w-64 bg-geminiSidebar border-r border-gray-800/80 flex flex-col h-full shrink-0 text-sm transform -translate-x-full md:translate-x-0 transition-transform duration-300 ease-in-out">
        
        <!-- Header Sidebar -->
        <div class="p-4 flex items-center justify-between">
            <div class="flex items-center gap-2 font-semibold text-base text-gray-100">
                <span class="text-xl bg-gradient-to-r from-blue-400 via-purple-400 to-pink-400 bg-clip-text text-transparent font-bold">✦ Aria Studio</span>
            </div>
            <!-- Botón cerrar en móvil -->
            <button onclick="toggleSidebar()" class="md:hidden text-gray-400 hover:text-white p-1 rounded-md hover:bg-geminiHover">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
        </div>

        <!-- Acciones Principales -->
        <div class="px-3 space-y-1">
            <button onclick="nuevaSesion()" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-full hover:bg-geminiHover text-left text-xs font-medium text-gray-200 transition">
                <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                <span>Nueva conversación</span>
            </button>
        </div>

        <div class="px-4 pt-4 pb-1 text-[11px] font-semibold text-gray-500 uppercase tracking-wider">Workspace / Archivos</div>
        <div id="file-tree" class="px-3 overflow-y-auto space-y-0.5 text-xs text-geminiMuted font-mono flex-1"></div>

        <!-- Perfil Footer -->
        <div class="p-3 border-t border-gray-800/80 flex items-center justify-between text-xs mt-auto">
            <div class="flex items-center gap-2 truncate">
                <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-indigo-600 to-purple-600 flex items-center justify-center font-bold text-white shadow">D</div>
                <div class="truncate">
                    <div class="font-medium text-gray-200">Deivis Urdaneta</div>
                    <div class="text-[10px] text-emerald-400 font-mono">Full-Stack Agent</div>
                </div>
            </div>
        </div>
    </aside>

    <!-- ÁREA PRINCIPAL -->
    <main class="flex-1 flex flex-col h-screen max-w-full overflow-hidden relative w-full">
        
        <!-- Header Superior -->
        <header class="h-14 px-4 md:px-6 flex items-center justify-between border-b border-gray-800/50 text-xs text-gray-400 bg-geminiBg/80 backdrop-blur z-20">
            <div class="flex items-center gap-3">
                <!-- Botón hamburguesa para móvil -->
                <button onclick="toggleSidebar()" class="md:hidden text-gray-300 hover:text-white p-1.5 rounded-lg bg-geminiSidebar border border-gray-800">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
                </button>
                <div class="flex items-center gap-2">
                    <span class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse"></span>
                    <span class="text-gray-200 font-medium text-sm md:text-xs">Aria AI v6.0</span>
                </div>
            </div>

            <div class="hidden sm:flex items-center gap-3">
                <span id="sys-stats" class="text-[11px] font-mono text-gray-400">CPU: -- | RAM: --</span>
            </div>
        </header>

        <!-- Contenedor de Mensajes -->
        <div id="messages" class="flex-1 overflow-y-auto px-3 sm:px-6 md:px-12 py-4 sm:py-6 space-y-6 max-w-4xl mx-auto w-full text-sm"></div>

        <!-- Indicador de carga -->
        <div id="loading" class="hidden max-w-4xl mx-auto w-full px-4 sm:px-6 md:px-12 py-2">
            <div class="flex items-center gap-2 text-xs text-purple-400 font-medium">
                <span class="animate-spin text-base">✦</span>
                <span>Aria está procesando...</span>
            </div>
        </div>

        <!-- Vista previa de imagen adjunta -->
        <div id="image-preview-container" class="hidden max-w-4xl mx-auto w-full px-4 sm:px-6 md:px-12 mb-2">
            <div class="relative inline-block">
                <img id="image-preview" class="h-20 w-auto rounded-xl border border-purple-500/80 object-cover shadow-lg" src="" alt="Vista previa">
                <button onclick="removerImagen()" class="absolute -top-2 -right-2 bg-red-600 text-white rounded-full w-5 h-5 flex items-center justify-center text-xs shadow-md">×</button>
            </div>
        </div>

        <!-- Input Barra Flotante Adaptada a Pantallas Pequeñas -->
        <div class="p-2 sm:p-4 md:px-12 bg-geminiBg border-t border-gray-800/40">
            <div class="max-w-4xl mx-auto space-y-2">
                <div class="bg-geminiInput rounded-2xl sm:rounded-3xl border border-gray-800/90 p-2 sm:p-3 shadow-2xl focus-within:border-purple-500/50 transition flex items-center gap-2">
                    
                    <input type="file" id="image-input" accept="image/*" class="hidden" onchange="cargarVistaPreviaImagen(event)">
                    <button type="button" onclick="document.getElementById('image-input').click()" class="text-gray-400 hover:text-white p-2 rounded-full hover:bg-geminiHover transition shrink-0" title="Adjuntar Imagen">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                    </button>

                    <input id="user-input" type="text" placeholder="Escribe a Aria o adjunta imagen..." class="flex-1 bg-transparent text-sm text-gray-100 placeholder-gray-500 focus:outline-none min-w-0 px-1">

                    <button type="button" onclick="enviarMensaje()" class="bg-purple-600 hover:bg-purple-700 text-white p-2 sm:px-4 sm:py-2 rounded-xl sm:rounded-full transition flex items-center justify-center shrink-0">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                    </button>
                </div>
            </div>
        </div>
    </main>

    <script>
        let imagenBase64 = null;

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebar-overlay');
            const isHidden = sidebar.classList.contains('-translate-x-full');
            
            if (isHidden) {
                sidebar.classList.remove('-translate-x-full');
                overlay.classList.remove('hidden');
            } else {
                sidebar.classList.add('-translate-x-full');
                overlay.classList.add('hidden');
            }
        }

        function cargarVistaPreviaImagen(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    imagenBase64 = e.target.result;
                    document.getElementById('image-preview').src = imagenBase64;
                    document.getElementById('image-preview-container').classList.remove('hidden');
                };
                reader.readAsDataURL(file);
            }
        }

        function removerImagen() {
            imagenBase64 = null;
            document.getElementById('image-input').value = '';
            document.getElementById('image-preview-container').classList.add('hidden');
        }

        async function cargarHistorial() {
            try {
                const res = await fetch('/api/historial');
                if (res.ok) {
                    const data = await res.json();
                    const container = document.getElementById('messages');
                    container.innerHTML = '';
                    data.historial.forEach(m => agregarBubble(m.rol, m.contenido));
                }
            } catch(e) { console.error(e); }
        }

        async function cargarMetricas() {
            try {
                const res = await fetch('/api/system/stats');
                if (res.ok) {
                    const data = await res.json();
                    document.getElementById('sys-stats').innerText = `CPU: ${data.metricas.cpu_uso} | RAM: ${data.metricas.ram_uso}`;
                }
            } catch(e) { console.error(e); }
        }

        async function cargarArbol() {
            try {
                const res = await fetch('/api/files/tree');
                if (res.ok) {
                    const data = await res.json();
                    const container = document.getElementById('file-tree');
                    container.innerHTML = '';
                    data.arbol.forEach(f => {
                        const d = document.createElement('div');
                        d.className = 'truncate hover:text-white cursor-pointer py-1 px-2 rounded hover:bg-geminiHover';
                        d.innerText = '📄 ' + f;
                        d.onclick = () => {
                            if (window.innerWidth < 768) toggleSidebar();
                        };
                        container.appendChild(d);
                    });
                }
            } catch(e) { console.error(e); }
        }

        async function enviarMensaje() {
            const input = document.getElementById('user-input');
            const text = input.value.trim();
            if (!text && !imagenBase64) return;

            let contenidoUsuario = text;
            if (imagenBase64) {
                contenidoUsuario += `\n\n![Imagen Adjunta](${imagenBase64})`;
            }

            agregarBubble('usuario', contenidoUsuario);
            
            const payload = { prompt: text, imagen: imagenBase64 };
            input.value = '';
            removerImagen();
            document.getElementById('loading').classList.remove('hidden');

            try {
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (res.ok) {
                    const data = await res.json();
                    agregarBubble('agente', data.respuesta);
                } else {
                    agregarBubble('agente', 'Error en el servidor (' + res.status + ')');
                }
            } catch(e) {
                agregarBubble('agente', 'Error de conexión: ' + e.message);
            } finally {
                document.getElementById('loading').classList.add('hidden');
            }
        }

        function agregarBubble(rol, texto) {
            const container = document.getElementById('messages');
            const isUser = rol === 'usuario';
            
            const div = document.createElement('div');
            div.className = `flex ${isUser ? 'justify-end' : 'justify-start'} w-full`;

            let innerHtml = '';
            if (isUser) {
                innerHtml = `
                    <div class="bg-geminiUserBubble text-gray-100 px-4 py-2.5 sm:px-5 sm:py-3 rounded-2xl sm:rounded-3xl max-w-[88%] sm:max-w-[80%] text-sm shadow">
                        ${marked.parse(texto)}
                    </div>
                `;
            } else {
                const parsedMarkdown = marked.parse(texto);
                innerHtml = `
                    <div class="flex gap-2.5 sm:gap-4 max-w-[100%] w-full">
                        <div class="text-base sm:text-lg text-purple-400 shrink-0 select-none">✦</div>
                        <div class="text-gray-200 text-sm space-y-3 overflow-x-auto markdown-body flex-1 min-w-0">
                            ${parsedMarkdown}
                        </div>
                    </div>
                `;
            }

            div.innerHTML = innerHtml;
            container.appendChild(div);

            div.querySelectorAll('pre code').forEach((block) => {
                hljs.highlightElement(block);
            });

            container.scrollTop = container.scrollHeight;
        }

        function nuevaSesion() {
            document.getElementById('messages').innerHTML = '';
            if (window.innerWidth < 768) toggleSidebar();
        }

        document.getElementById('user-input').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                enviarMensaje();
            }
        });

        window.onload = function() {
            cargarHistorial();
            cargarMetricas();
            cargarArbol();
            setInterval(cargarMetricas, 10000);
        };
    </script>
</body>
</html>
