<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aria Mirror AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/tokyo-night-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        geminiBg: '#131314',
                        geminiSidebar: '#1e1f20',
                        geminiHover: '#282a2c',
                        geminiInput: '#1e1f20',
                        geminiUserBubble: '#282a2c',
                        geminiText: '#e3e2e6',
                        geminiMuted: '#c4c6d0'
                    }
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: #131314; }
        ::-webkit-scrollbar-thumb { background: #282a2c; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #374151; }
        .markdown-body pre { background-color: #1e1f20 !important; border: 1px solid #282a2c; border-radius: 0.5rem; padding: 1rem; margin-top: 0.5rem; margin-bottom: 0.5rem; }
        .markdown-body ul { list-style-type: disc; padding-left: 1.25rem; margin-top: 0.5rem; margin-bottom: 0.5rem; }
        .markdown-body ol { list-style-type: decimal; padding-left: 1.25rem; margin-top: 0.5rem; margin-bottom: 0.5rem; }
        .markdown-body p { margin-bottom: 0.75rem; line-height: 1.6; }
    </style>
</head>
<body class="bg-geminiBg text-geminiText min-h-screen flex font-sans antialiased overflow-hidden">

    <!-- SIDEBAR -->
    <aside class="w-64 bg-geminiSidebar border-r border-gray-800 flex flex-col h-screen shrink-0 text-sm">
        <div class="p-4 flex items-center justify-between">
            <div class="flex items-center gap-2 font-semibold text-base text-gray-100">
                <span class="text-xl bg-gradient-to-r from-blue-400 via-purple-400 to-pink-400 bg-clip-text text-transparent font-bold">✦ Aria</span>
            </div>
        </div>

        <div class="px-3 space-y-1">
            <button onclick="nuevaSesion()" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-full hover:bg-geminiHover text-left text-xs font-medium text-gray-200 transition">
                <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                <span>Nueva conversación</span>
            </button>
        </div>

        <div class="px-4 pt-4 pb-1 text-[11px] font-semibold text-gray-500 uppercase tracking-wider">Workspace</div>
        <div id="file-tree" class="px-3 overflow-y-auto space-y-0.5 text-xs text-geminiMuted font-mono"></div>

        <div class="mt-auto p-3 border-t border-gray-800 flex items-center gap-2 text-xs">
            <div class="w-7 h-7 rounded-full bg-indigo-600 flex items-center justify-center font-bold text-white">D</div>
            <div class="truncate">
                <div class="font-medium text-gray-200">Deivis Urdaneta</div>
                <div class="text-[10px] text-emerald-400">Modo Unificado Activo</div>
            </div>
        </div>
    </aside>

    <!-- ÁREA PRINCIPAL -->
    <main class="flex-1 flex flex-col h-screen max-w-full overflow-hidden relative">
        <header class="h-12 px-6 flex items-center justify-between text-xs text-gray-400">
            <div class="flex items-center gap-2">
                <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                <span class="text-gray-300 font-medium">Aria Studio - Motor Multimodal Unificado</span>
            </div>
            <span id="sys-stats" class="text-[11px] font-mono text-gray-500">CPU: -- | RAM: --</span>
        </header>

        <div id="messages" class="flex-1 overflow-y-auto px-4 md:px-12 py-6 space-y-8 max-w-4xl mx-auto w-full text-sm"></div>

        <div id="loading" class="hidden max-w-4xl mx-auto w-full px-4 md:px-12 py-2">
            <div class="flex items-center gap-2 text-xs text-purple-400">
                <span class="animate-spin">✦</span>
                <span>Procesando solicitud...</span>
            </div>
        </div>

        <!-- Vista previa de imagen adjunta -->
        <div id="image-preview-container" class="hidden max-w-4xl mx-auto w-full px-4 md:px-12 mb-2">
            <div class="relative inline-block">
                <img id="image-preview" class="h-20 w-auto rounded-lg border border-purple-500 object-cover" src="" alt="Vista previa">
                <button onclick="removerImagen()" class="absolute -top-2 -right-2 bg-red-600 text-white rounded-full w-5 h-5 flex items-center justify-center text-xs">×</button>
            </div>
        </div>

        <!-- INPUT FLOTANTE -->
        <div class="p-4 md:px-12 bg-geminiBg">
            <div class="max-w-4xl mx-auto space-y-2">
                <div class="bg-geminiInput rounded-3xl border border-gray-800 p-3 shadow-xl focus-within:border-gray-700 transition flex items-center gap-3">
                    
                    <!-- Botón para adjuntar imagen -->
                    <input type="file" id="image-input" accept="image/*" class="hidden" onchange="cargarVistaPreviaImagen(event)">
                    <button type="button" onclick="document.getElementById('image-input').click()" class="text-gray-400 hover:text-white p-1 rounded-full hover:bg-geminiHover transition" title="Adjuntar Imagen de Referencia">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                    </button>

                    <input id="user-input" type="text" placeholder="Pregunta algo, adjunta una imagen o solicita desarrollo..." class="flex-1 bg-transparent text-sm text-gray-100 placeholder-gray-500 focus:outline-none">

                    <button type="button" onclick="enviarMensaje()" class="bg-purple-600 hover:bg-purple-700 text-white p-2 rounded-full transition">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                    </button>
                </div>
            </div>
        </div>
    </main>

    <script>
        let imagenBase64 = null;

        cargarHistorial();
        cargarMetricas();
        cargarArbol();
        setInterval(cargarMetricas, 10000);

        function cargarVistaPreviaImagen(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    imagenBase64 = e.target.result;
                    document.getElementById('image-preview').src = imagenBase64;
                    document.getElementById('image-preview-container').classList.remove('hidden');
                };
                reader.readAsDataURL(file);
            }
        }

        function removerImagen() {
            imagenBase64 = null;
            document.getElementById('image-input').value = '';
            document.getElementById('image-preview-container').classList.add('hidden');
        }

        async function cargarHistorial() {
            try {
                const res = await fetch('/api/historial');
                if (res.ok) {
                    const data = await res.json();
                    const container = document.getElementById('messages');
                    container.innerHTML = '';
                    data.historial.forEach(m => agregarBubble(m.rol, m.contenido));
                }
            } catch(e) { console.error(e); }
        }

        async function cargarMetricas() {
            try {
                const res = await fetch('/api/system/stats');
                if (res.ok) {
                    const data = await res.json();
                    document.getElementById('sys-stats').innerText = `CPU: ${data.metricas.cpu_uso} | RAM: ${data.metricas.ram_uso}`;
                }
            } catch(e) { console.error(e); }
        }

        async function cargarArbol() {
            try {
                const res = await fetch('/api/files/tree');
                if (res.ok) {
                    const data = await res.json();
                    const container = document.getElementById('file-tree');
                    container.innerHTML = '';
                    data.arbol.forEach(f => {
                        const d = document.createElement('div');
                        d.className = 'truncate hover:text-white cursor-pointer py-1 px-2 rounded hover:bg-geminiHover';
                        d.innerText = '📄 ' + f;
                        container.appendChild(d);
                    });
                }
            } catch(e) { console.error(e); }
        }

        async function enviarMensaje() {
            const input = document.getElementById('user-input');
            const text = input.value.trim();
            if (!text && !imagenBase64) return;

            let contenidoUsuario = text;
            if (imagenBase64) {
                contenidoUsuario += `\n\n![Imagen Adjunta](${imagenBase64})`;
            }

            agregarBubble('usuario', contenidoUsuario);
            
            const payload = { prompt: text, imagen: imagenBase64 };
            input.value = '';
            removerImagen();
            document.getElementById('loading').classList.remove('hidden');

            try {
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (res.ok) {
                    const data = await res.json();
                    agregarBubble('agente', data.respuesta);
                } else {
                    agregarBubble('agente', 'Error en el servidor (' + res.status + ')');
                }
            } catch(e) {
                agregarBubble('agente', 'Error de conexión: ' + e.message);
            } finally {
                document.getElementById('loading').classList.add('hidden');
            }
        }

        function agregarBubble(rol, texto) {
            const container = document.getElementById('messages');
            const isUser = rol === 'usuario';
            
            const div = document.createElement('div');
            div.className = `flex ${isUser ? 'justify-end' : 'justify-start'} w-full`;

            let innerHtml = '';
            if (isUser) {
                innerHtml = `
                    <div class="bg-geminiUserBubble text-gray-100 px-5 py-3 rounded-3xl max-w-[80%] text-sm">
                        ${marked.parse(texto)}
                    </div>
                `;
            } else {
                const parsedMarkdown = marked.parse(texto);
                innerHtml = `
                    <div class="flex gap-4 max-w-[100%] w-full">
                        <div class="text-lg text-purple-400 shrink-0 select-none">✦</div>
                        <div class="text-gray-200 text-sm space-y-3 overflow-x-auto markdown-body flex-1">
                            ${parsedMarkdown}
                        </div>
                    </div>
                `;
            }

            div.innerHTML = innerHtml;
            container.appendChild(div);

            div.querySelectorAll('pre code').forEach((block) => {
                hljs.highlightElement(block);
            });

            container.scrollTop = container.scrollHeight;
        }

        function nuevaSesion() {
            document.getElementById('messages').innerHTML = '';
        }

        document.getElementById('user-input').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                enviarMensaje();
            }
        });
    </script>
</body>
</html>
