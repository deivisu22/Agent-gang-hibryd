<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aria AI Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        body { background-color: #0d0f17; color: #e2e8f0; font-family: system-ui, -apple-system, sans-serif; }
        .glass-panel { background: rgba(22, 27, 46, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .chat-container { height: calc(100vh - 120px); }
        .markdown-body pre { background: #1a1d2e; padding: 1rem; border-radius: 0.5rem; overflow-x: auto; margin: 0.5rem 0; }
        .markdown-body code { font-family: monospace; background: rgba(255, 255, 255, 0.1); padding: 0.2rem 0.4rem; border-radius: 0.25rem; }
    </style>
</head>
<body class="h-screen overflow-hidden flex flex-col">

    <!-- Navbar -->
    <header class="h-14 glass-panel border-b border-slate-800 flex items-center justify-between px-4 z-20">
        <div class="flex items-center space-x-3">
            <button id="btn-menu" class="text-slate-400 hover:text-white md:hidden">
                <i class="fa-solid fa-bars text-lg"></i>
            </button>
            <span class="font-bold text-lg bg-gradient-to-r from-purple-400 to-pink-500 bg-clip-text text-transparent">✦ Aria Studio</span>
        </div>
        <div class="text-xs text-slate-500 font-mono hidden sm:block">
            CPU: Vercel Serverless | RAM: Auto-scaled
        </div>
    </header>

    <div class="flex flex-1 overflow-hidden relative">
        <!-- Sidebar -->
        <aside id="sidebar" class="w-64 glass-panel border-r border-slate-800 flex flex-col justify-between absolute md:relative z-30 h-full transform -translate-x-full md:translate-x-0 transition-transform duration-300">
            <div class="p-4 space-y-4">
                <button onclick="reiniciarChat()" class="w-full py-2 px-4 bg-purple-600/20 hover:bg-purple-600/30 border border-purple-500/30 rounded-xl text-purple-300 text-sm font-semibold transition flex items-center justify-center space-x-2">
                    <i class="fa-solid fa-plus text-xs"></i>
                    <span>Nueva conversación</span>
                </button>
                <div class="space-y-1">
                    <p class="text-xs font-semibold text-slate-500 uppercase tracking-wider px-2">Archivos Workspace</p>
                    <div id="file-tree" class="text-xs text-slate-400 space-y-1 pl-2">
                        <!-- Carga dinamica de archivos -->
                    </div>
                </div>
            </div>
            <div class="p-4 border-t border-slate-800 text-xs text-slate-500">
                <p class="font-semibold text-slate-300">Deivis Urdaneta</p>
                <p class="text-emerald-400 font-mono">Aria AI v6.0 Active</p>
            </div>
        </aside>

        <!-- Main Chat Area -->
        <main class="flex-1 flex flex-col relative w-full h-full bg-slate-950/50">
            <div id="chat-box" class="flex-1 overflow-y-auto p-4 space-y-4 pb-28">
                <!-- Los mensajes se insertan aqui -->
            </div>

            <!-- Sticky Input Bar -->
            <div class="absolute bottom-0 left-0 right-0 p-4 bg-gradient-to-t from-[#0d0f17] via-[#0d0f17]/90 to-transparent z-10">
                <div class="max-w-4xl mx-auto glass-panel rounded-2xl p-2 flex items-center space-x-2 shadow-2xl border border-slate-700/50">
                    <label for="img-input" class="p-2 text-slate-400 hover:text-purple-400 cursor-pointer transition">
                        <i class="fa-solid fa-camera text-lg"></i>
                        <input type="file" id="img-input" accept="image/*" class="hidden" onchange="previewImagen(event)">
                    </label>
                    <input type="text" id="prompt-input" placeholder="Escribe tu mensaje..." class="flex-1 bg-transparent text-slate-100 placeholder-slate-500 text-sm focus:outline-none px-2" onkeypress="if(event.key === 'Enter') enviarMensaje()">
                    <button onclick="enviarMensaje()" id="btn-send" class="bg-purple-600 hover:bg-purple-500 text-white font-semibold text-xs px-5 py-2.5 rounded-xl transition flex items-center space-x-1">
                        <span>Enviar</span>
                    </button>
                </div>
                <div id="img-preview-container" class="max-w-4xl mx-auto mt-2 hidden">
                    <div class="inline-flex items-center space-x-2 bg-slate-800 px-3 py-1 rounded-lg text-xs text-slate-300">
                        <i class="fa-solid fa-image text-purple-400"></i>
                        <span id="img-name">imagen.jpg</span>
                        <button onclick="removerImagen()" class="text-slate-400 hover:text-red-400 ml-2"><i class="fa-solid fa-xmark"></i></button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        let imagenBase64 = null;

        // Toggle Sidebar en Movil
        document.getElementById('btn-menu').addEventListener('click', () => {
            const sidebar = document.getElementById('sidebar');
            sidebar.classList.toggle('-translate-x-full');
        });

        function previewImagen(e) {
            const file = e.target.files[0];
            if (!file) return;
            document.getElementById('img-name').innerText = file.name;
            document.getElementById('img-preview-container').classList.remove('hidden');

            const reader = new FileReader();
            reader.onload = function(evt) {
                imagenBase64 = evt.target.result;
            };
            reader.readAsDataURL(file);
        }

        function removerImagen() {
            imagenBase64 = null;
            document.getElementById('img-input').value = '';
            document.getElementById('img-preview-container').classList.add('hidden');
        }

        function agregarMensaje(rol, texto) {
            const chatBox = document.getElementById('chat-box');
            const msgDiv = document.createElement('div');
            msgDiv.className = `flex ${rol === 'usuario' ? 'justify-end' : 'justify-start'} animate-fade-in`;

            const bubble = document.createElement('div');
            bubble.className = `max-w-[85%] sm:max-w-[75%] rounded-2xl p-4 text-sm ${
                rol === 'usuario' 
                ? 'bg-purple-600/30 border border-purple-500/30 text-purple-100 rounded-br-none' 
                : 'glass-panel border border-slate-700/50 text-slate-200 rounded-bl-none markdown-body'
            }`;

            if (rol === 'agente') {
                bubble.innerHTML = marked.parse(texto);
            } else {
                bubble.innerText = texto;
            }

            msgDiv.appendChild(bubble);
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        async function enviarMensaje() {
            const input = document.getElementById('prompt-input');
            const prompt = input.value.trim();
            if (!prompt && !imagenBase64) return;

            const userText = prompt || "[Imagen enviada]";
            agregarMensaje('usuario', userText);

            input.value = '';
            const imgData = imagenBase64;
            removerImagen();

            const btnSend = document.getElementById('btn-send');
            btnSend.disabled = true;
            btnSend.classList.add('opacity-50');

            try {
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: prompt, imagen: imgData })
                });

                const data = await res.json();

                if (res.ok && data.respuesta) {
                    agregarMensaje('agente', data.respuesta);
                } else {
                    const errorDetalle = data.detail || JSON.stringify(data);
                    agregarMensaje('agente', `⚠️ **Diagnóstico de Error Serverless:**\n\n\`\`\`text\n${errorDetalle}\n\`\`\``);
                }
            } catch (err) {
                agregarMensaje('agente', `⚠️ **Error de Red/Cliente:**\n\n\`\`\`text\n${err.message}\n\`\`\``);
            } finally {
                btnSend.disabled = false;
                btnSend.classList.remove('opacity-50');
            }
        }

        function reiniciarChat() {
            document.getElementById('chat-box').innerHTML = '';
        }

        // Cargar árbol de archivos al iniciar
        fetch('/api/files/tree')
            .then(res => res.json())
            .then(data => {
                const tree = document.getElementById('file-tree');
                if (data.arbol) {
                    tree.innerHTML = data.arbol.map(f => `<div class="flex items-center space-x-2"><i class="fa-regular fa-file text-slate-500"></i><span>${f}</span></div>`).join('');
                }
            }).catch(() => {});
    </script>
</body>
</html>
